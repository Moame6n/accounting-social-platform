<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="منصة المحاسبين - شبكة تواصل احترافية للمحاسبين والخبراء الماليين">
    <title>منصة المحاسبين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        .gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .gradient-hover:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6a3d8a 100%);
        }

        .transition-all {
            transition: all 0.3s ease;
        }

        .shadow-lg-custom {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        /* Responsive utilities */
        @media (max-width: 768px) {
            .sidebar-responsive {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 40;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar-responsive.active {
                transform: translateX(0);
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============ CONFIGURATION ============
        const CONFIG = {
            SUPABASE_URL: 'https://qfofvlypuzqjyzvjyzvj.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmb2Z2bHlwdXpxanl6dmp5enZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTYxNjY0MDAsImV4cCI6MTgzMTc1ODQwMH0.your_anon_key_here'
        };

        // ============ STATE MANAGEMENT ============
        const state = {
            currentUser: null,
            currentPage: 'auth',
            currentCategory: '',
            posts: [],
            categories: [
                { id: 1, name: 'محاسبة مالية', icon: 'mdi-chart-bar' },
                { id: 2, name: 'ضرائب', icon: 'mdi-file-document-outline' },
                { id: 3, name: 'تدقيق', icon: 'mdi-magnify' },
                { id: 4, name: 'محاسبة تكاليف', icon: 'mdi-calculator' },
                { id: 5, name: 'نصائح مهنية', icon: 'mdi-lightbulb-on-outline' }
            ]
        };

        // ============ SUPABASE INITIALIZATION ============
        const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        // ============ UTILITY FUNCTIONS ============
        function showMessage(message, type = 'success') {
            const messageEl = document.createElement('div');
            messageEl.className = `fixed top-4 right-4 z-50 p-4 rounded-lg text-white font-semibold fade-in ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            messageEl.textContent = message;
            document.body.appendChild(messageEl);
            setTimeout(() => messageEl.remove(), 3000);
        }

        function showLoading(show = true) {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.display = show ? 'flex' : 'none';
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============ AUTHENTICATION FUNCTIONS ============
        async function handleRegister(email, password, fullName) {
            if (!email || !password || !fullName) {
                showMessage('يرجى ملء جميع الحقول', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            showLoading(true);
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: fullName }
                    }
                });

                if (error) {
                    showMessage(error.message, 'error');
                } else {
                    showMessage('تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك الإلكتروني', 'success');
                    setTimeout(() => {
                        document.getElementById('registerForm').classList.add('hidden');
                        document.getElementById('loginForm').classList.remove('hidden');
                    }, 2000);
                }
            } catch (error) {
                showMessage('حدث خطأ: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function handleLogin(email, password) {
            if (!email || !password) {
                showMessage('يرجى إدخال البريد وكلمة المرور', 'error');
                return;
            }

            showLoading(true);
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showMessage(error.message, 'error');
                } else if (data.user) {
                    state.currentUser = data.user;
                    state.currentPage = 'dashboard';
                    showMessage('تم تسجيل الدخول بنجاح!', 'success');
                    render();
                    loadPosts();
                }
            } catch (error) {
                showMessage('حدث خطأ: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function handleLogout() {
            showLoading(true);
            try {
                await supabase.auth.signOut();
                state.currentUser = null;
                state.currentPage = 'auth';
                state.currentCategory = '';
                state.posts = [];
                showMessage('تم تسجيل الخروج بنجاح', 'success');
                render();
            } catch (error) {
                showMessage('خطأ في تسجيل الخروج', 'error');
            } finally {
                showLoading(false);
            }
        }

        async function checkAuth() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    state.currentUser = user;
                    state.currentPage = 'dashboard';
                } else {
                    state.currentPage = 'auth';
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
            render();
        }

        // ============ POST FUNCTIONS ============
        async function loadPosts() {
            showLoading(true);
            try {
                let query = supabase.from('posts').select('*');
                
                if (state.currentCategory) {
                    query = query.eq('category', state.currentCategory);
                }

                const { data, error } = await query.order('created_at', { ascending: false });

                if (error) {
                    showMessage('خطأ في تحميل المنشورات', 'error');
                    state.posts = [];
                } else {
                    state.posts = data || [];
                }
            } catch (error) {
                showMessage('خطأ: ' + error.message, 'error');
                state.posts = [];
            } finally {
                showLoading(false);
                render();
            }
        }

        async function createPost(content, category) {
            if (!content.trim()) {
                showMessage('لا يمكن نشر منشور فارغ', 'error');
                return;
            }

            if (!state.currentUser) {
                showMessage('يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            showLoading(true);
            try {
                const { data, error } = await supabase.from('posts').insert([{
                    user_id: state.currentUser.id,
                    author_name: state.currentUser.user_metadata?.full_name || state.currentUser.email,
                    author_email: state.currentUser.email,
                    content: content.trim(),
                    category: category,
                    created_at: new Date().toISOString(),
                    likes: 0
                }]);

                if (error) {
                    showMessage('خطأ في نشر المنشور: ' + error.message, 'error');
                } else {
                    showMessage('تم نشر المنشور بنجاح!', 'success');
                    document.getElementById('postContent').value = '';
                    loadPosts();
                }
            } catch (error) {
                showMessage('خطأ: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        async function toggleLike(postId) {
            if (!state.currentUser) {
                showMessage('يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            try {
                const post = state.posts.find(p => p.id === postId);
                if (!post) return;

                const newLikes = (post.likes || 0) + 1;
                const { error } = await supabase.from('posts').update({ likes: newLikes }).eq('id', postId);

                if (!error) {
                    post.likes = newLikes;
                    render();
                }
            } catch (error) {
                showMessage('خطأ: ' + error.message, 'error');
            }
        }

        function filterByCategory(categoryName) {
            state.currentCategory = categoryName;
            loadPosts();
        }

        // ============ RENDER FUNCTIONS ============
        function renderAuthPage() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-blue-50 p-4">
                    <div class="w-full max-w-md">
                        <!-- Logo Section -->
                        <div class="text-center mb-8">
                            <div class="flex justify-center mb-4">
                                <div class="w-16 h-16 gradient-primary rounded-full flex items-center justify-center text-white text-3xl">
                                    <i class="mdi mdi-finance"></i>
                                </div>
                            </div>
                            <h1 class="text-4xl font-bold text-gray-800 mb-2">منصة المحاسبين</h1>
                            <p class="text-gray-600">شبكة تواصل احترافية للمحاسبين والخبراء الماليين</p>
                        </div>

                        <!-- Auth Card -->
                        <div class="bg-white rounded-2xl shadow-lg-custom p-8">
                            <!-- Login Form -->
                            <div id="loginForm">
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">تسجيل الدخول</h2>
                                <div class="space-y-4 mb-6">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">البريد الإلكتروني</label>
                                        <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                                        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                                    </div>
                                </div>
                                <button onclick="handleLoginClick()" 
                                    class="w-full gradient-primary gradient-hover text-white font-bold py-3 rounded-lg transition-all mb-4">
                                    دخول
                                </button>
                                <p class="text-center text-gray-600">
                                    ليس لديك حساب؟ 
                                    <a href="#" onclick="toggleAuthForms(); return false;" class="text-purple-600 font-bold hover:text-purple-700">
                                        إنشاء حساب جديد
                                    </a>
                                </p>
                            </div>

                            <!-- Register Form -->
                            <div id="registerForm" class="hidden">
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">إنشاء حساب جديد</h2>
                                <div class="space-y-4 mb-6">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">الاسم الكامل</label>
                                        <input type="text" id="registerFullName" placeholder="أدخل اسمك الكامل" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">البريد الإلكتروني</label>
                                        <input type="email" id="registerEmail" placeholder="أدخل بريدك الإلكتروني" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                                        <input type="password" id="registerPassword" placeholder="اختر كلمة مرور قوية (6 أحرف على الأقل)" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
                                    </div>
                                </div>
                                <button onclick="handleRegisterClick()" 
                                    class="w-full gradient-primary gradient-hover text-white font-bold py-3 rounded-lg transition-all mb-4">
                                    إنشاء الحساب
                                </button>
                                <p class="text-center text-gray-600">
                                    لديك حساب بالفعل؟ 
                                    <a href="#" onclick="toggleAuthForms(); return false;" class="text-purple-600 font-bold hover:text-purple-700">
                                        تسجيل الدخول
                                    </a>
                                </p>
                            </div>
                        </div>

                        <!-- Footer -->
                        <p class="text-center text-gray-500 text-sm mt-8">
                            &copy; 2026 منصة المحاسبين. جميع الحقوق محفوظة.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div class="flex h-screen bg-gray-50 overflow-hidden">
                    <!-- Mobile Menu Button -->
                    <button onclick="toggleMobileMenu()" class="md:hidden fixed top-4 left-4 z-50 p-2 bg-white rounded-lg shadow-lg">
                        <i class="mdi mdi-menu text-2xl text-gray-800"></i>
                    </button>

                    <!-- Sidebar -->
                    <aside class="sidebar-responsive md:relative md:w-64 bg-white shadow-lg flex flex-col overflow-y-auto md:overflow-y-auto">
                        <div class="p-6 border-b border-gray-200">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-12 h-12 gradient-primary rounded-full flex items-center justify-center text-white text-xl">
                                    <i class="mdi mdi-finance"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-gray-800">محاسبون</h1>
                            </div>
                        </div>

                        <!-- User Profile -->
                        <div class="p-6 border-b border-gray-200">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                                    <i class="mdi mdi-account text-purple-600 text-xl"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="font-semibold text-gray-800 truncate">${state.currentUser.user_metadata?.full_name || state.currentUser.email}</p>
                                    <p class="text-sm text-gray-500 truncate">${state.currentUser.email}</p>
                                </div>
                            </div>
                            <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-semibold py-2 rounded-lg hover:bg-red-100 transition-all">
                                تسجيل الخروج
                            </button>
                        </div>

                        <!-- Navigation -->
                        <nav class="p-6 border-b border-gray-200">
                            <ul class="space-y-2">
                                <li><a href="#" class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all"><i class="mdi mdi-home-variant text-xl"></i>الرئيسية</a></li>
                                <li><a href="#" class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all"><i class="mdi mdi-account-group text-xl"></i>المحاسبون</a></li>
                                <li><a href="#" class="flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all"><i class="mdi mdi-briefcase text-xl"></i>الوظائف</a></li>
                            </ul>
                        </nav>

                        <!-- Categories -->
                        <div class="p-6 flex-1 overflow-y-auto scrollbar-hide">
                            <h3 class="text-sm font-bold text-gray-500 mb-4 uppercase">الأقسام</h3>
                            <ul class="space-y-2">
                                <li>
                                    <button onclick="filterByCategory('')" class="w-full text-right flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all ${!state.currentCategory ? 'bg-purple-100 text-purple-600' : ''}">
                                        <i class="mdi mdi-star text-xl"></i>
                                        <span>الكل</span>
                                    </button>
                                </li>
                                ${state.categories.map(cat => `
                                    <li>
                                        <button onclick="filterByCategory('${cat.name}')" class="w-full text-right flex items-center gap-3 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all ${state.currentCategory === cat.name ? 'bg-purple-100 text-purple-600' : ''}">
                                            <i class="mdi ${cat.icon} text-xl"></i>
                                            <span>${cat.name}</span>
                                        </button>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Footer -->
                        <div class="p-6 border-t border-gray-200 text-center text-xs text-gray-500">
                            &copy; 2026 منصة المحاسبين
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <main class="flex-1 overflow-y-auto">
                        <div class="max-w-2xl mx-auto p-4 md:p-6 space-y-6">
                            <!-- Create Post -->
                            <div class="bg-white rounded-xl shadow-md p-6">
                                <h2 class="text-xl font-bold text-gray-800 mb-4">إنشاء منشور جديد</h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">الفئة</label>
                                        <select id="postCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                                            ${state.categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">المحتوى</label>
                                        <textarea id="postContent" placeholder="ما الذي تود مشاركته مع المحاسبين؟" 
                                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none" 
                                            rows="4"></textarea>
                                    </div>
                                    <button onclick="handleCreatePostClick()" 
                                        class="w-full gradient-primary gradient-hover text-white font-bold py-3 rounded-lg transition-all">
                                        نشر المنشور
                                    </button>
                                </div>
                            </div>

                            <!-- Posts Feed -->
                            <div class="space-y-4">
                                ${state.posts.length === 0 ? `
                                    <div class="bg-white rounded-xl shadow-md p-12 text-center">
                                        <i class="mdi mdi-inbox text-6xl text-gray-300 mb-4"></i>
                                        <p class="text-gray-500 text-lg">لا توجد منشورات حتى الآن. كن أول من ينشر!</p>
                                    </div>
                                ` : state.posts.map(post => `
                                    <div class="bg-white rounded-xl shadow-md p-6 fade-in">
                                        <div class="flex items-center justify-between mb-4">
                                            <div class="flex items-center gap-3">
                                                <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                                                    <i class="mdi mdi-account text-purple-600"></i>
                                                </div>
                                                <div>
                                                    <p class="font-bold text-gray-800">${post.author_name}</p>
                                                    <p class="text-xs text-gray-500">${formatDate(post.created_at)}</p>
                                                </div>
                                            </div>
                                            <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-semibold">${post.category}</span>
                                        </div>
                                        <p class="text-gray-700 mb-4 leading-relaxed">${post.content}</p>
                                        <div class="flex gap-4 pt-4 border-t border-gray-200">
                                            <button onclick="toggleLike(${post.id})" class="flex items-center gap-2 text-gray-600 hover:text-red-500 transition-all">
                                                <i class="mdi mdi-heart-outline text-xl"></i>
                                                <span class="text-sm">${post.likes || 0}</span>
                                            </button>
                                            <button class="flex items-center gap-2 text-gray-600 hover:text-blue-500 transition-all">
                                                <i class="mdi mdi-comment-outline text-xl"></i>
                                                <span class="text-sm">تعليق</span>
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function render() {
            const root = document.getElementById('root');
            root.innerHTML = state.currentPage === 'auth' ? renderAuthPage() : renderDashboard();
        }

        // ============ EVENT HANDLERS ============
        function toggleAuthForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }

        function handleLoginClick() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            handleLogin(email, password);
        }

        function handleRegisterClick() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const fullName = document.getElementById('registerFullName').value;
            handleRegister(email, password, fullName);
        }

        function handleCreatePostClick() {
            const content = document.getElementById('postContent').value;
            const category = document.getElementById('postCategory').value;
            createPost(content, category);
        }

        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar-responsive');
            sidebar.classList.toggle('active');
        }

        // ============ INITIALIZATION ============
        document.addEventListener('DOMContentLoaded', () => {
            // Create loader
            const loader = document.createElement('div');
            loader.id = 'loader';
            loader.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden';
            loader.innerHTML = '<div class="loading-spinner"></div>';
            document.body.appendChild(loader);

            // Check auth and render
            checkAuth();
        });

        // Handle Enter key in forms
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (state.currentPage === 'auth') {
                    if (document.getElementById('loginForm').classList.contains('hidden')) {
                        handleRegisterClick();
                    } else {
                        handleLoginClick();
                    }
                }
            }
        });
    </script>
</body>
</html>
