<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="منصة المحاسبين - شبكة تواصل احترافية للمحاسبين والخبراء الماليين">
    <title>منصة المحاسبين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
        }

        .gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .gradient-hover:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6a3d8a 100%);
        }

        .transition-all {
            transition: all 0.3s ease;
        }

        .shadow-lg-custom {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .sidebar-responsive {
                position: fixed;
                left: 0;
                top: 0;
                width: 75%;
                height: 100%;
                z-index: 40;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                background: white;
                overflow-y: auto;
            }

            .sidebar-responsive.active {
                transform: translateX(0);
            }

            .overlay-mobile {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 30;
                display: none;
            }

            .overlay-mobile.active {
                display: block;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-primary {
            @apply px-4 py-2 gradient-primary text-white rounded-lg font-semibold transition-all hover:shadow-lg;
        }

        .input-field {
            @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all;
        }

        .post-card {
            @apply bg-white rounded-xl shadow-md p-6 fade-in hover:shadow-lg transition-all;
        }

        .category-btn {
            @apply flex items-center gap-2 p-3 rounded-lg text-gray-700 hover:bg-purple-50 transition-all cursor-pointer;
        }

        .category-btn.active {
            @apply bg-purple-100 text-purple-600;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============ STATE MANAGEMENT ============
        const state = {
            currentUser: null,
            currentPage: 'auth',
            currentCategory: '',
            posts: [],
            users: [],
            categories: [
                { id: 1, name: 'محاسبة مالية', icon: 'mdi-chart-bar' },
                { id: 2, name: 'ضرائب', icon: 'mdi-file-document-outline' },
                { id: 3, name: 'تدقيق', icon: 'mdi-magnify' },
                { id: 4, name: 'محاسبة تكاليف', icon: 'mdi-calculator' },
                { id: 5, name: 'نصائح مهنية', icon: 'mdi-lightbulb-on-outline' }
            ]
        };

        // ============ LOCAL STORAGE MANAGEMENT ============
        const storage = {
            getUsers: () => JSON.parse(localStorage.getItem('accounting_users') || '[]'),
            saveUsers: (users) => localStorage.setItem('accounting_users', JSON.stringify(users)),
            getPosts: () => JSON.parse(localStorage.getItem('accounting_posts') || '[]'),
            savePosts: (posts) => localStorage.setItem('accounting_posts', JSON.stringify(posts)),
            getCurrentUser: () => JSON.parse(localStorage.getItem('current_user') || 'null'),
            setCurrentUser: (user) => localStorage.setItem('current_user', JSON.stringify(user)),
            clearCurrentUser: () => localStorage.removeItem('current_user')
        };

        // ============ UTILITY FUNCTIONS ============
        function showMessage(message, type = 'success') {
            const messageEl = document.createElement('div');
            messageEl.className = `fixed top-4 right-4 z-50 p-4 rounded-lg text-white font-semibold fade-in ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            messageEl.textContent = message;
            document.body.appendChild(messageEl);
            setTimeout(() => messageEl.remove(), 3000);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // ============ AUTHENTICATION FUNCTIONS ============
        function handleRegister(email, password, fullName) {
            if (!email || !password || !fullName) {
                showMessage('يرجى ملء جميع الحقول', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('البريد الإلكتروني غير صحيح', 'error');
                return;
            }

            state.users = storage.getUsers();
            if (state.users.find(u => u.email === email)) {
                showMessage('هذا البريد مسجل بالفعل', 'error');
                return;
            }

            const newUser = {
                id: generateId(),
                email,
                password,
                fullName,
                createdAt: new Date().toISOString()
            };

            state.users.push(newUser);
            storage.saveUsers(state.users);
            showMessage('تم إنشاء الحساب بنجاح! يرجى تسجيل الدخول', 'success');
            
            setTimeout(() => {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').value = '';
            }, 1500);
        }

        function handleLogin(email, password) {
            if (!email || !password) {
                showMessage('يرجى إدخال البريد وكلمة المرور', 'error');
                return;
            }

            state.users = storage.getUsers();
            const user = state.users.find(u => u.email === email && u.password === password);

            if (!user) {
                showMessage('البريد أو كلمة المرور غير صحيحة', 'error');
                return;
            }

            state.currentUser = { id: user.id, email: user.email, fullName: user.fullName };
            storage.setCurrentUser(state.currentUser);
            state.currentPage = 'dashboard';
            showMessage('تم تسجيل الدخول بنجاح!', 'success');
            loadPosts();
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            state.currentPage = 'auth';
            state.currentCategory = '';
            storage.clearCurrentUser();
            showMessage('تم تسجيل الخروج بنجاح', 'success');
            render();
        }

        function checkAuth() {
            const user = storage.getCurrentUser();
            if (user) {
                state.currentUser = user;
                state.currentPage = 'dashboard';
                loadPosts();
            } else {
                state.currentPage = 'auth';
            }
            render();
        }

        // ============ POST FUNCTIONS ============
        function loadPosts() {
            state.posts = storage.getPosts();
            if (state.currentCategory) {
                state.posts = state.posts.filter(p => p.category === state.currentCategory);
            }
            state.posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            render();
        }

        function createPost(content, category) {
            if (!content.trim()) {
                showMessage('لا يمكن نشر منشور فارغ', 'error');
                return;
            }

            if (!state.currentUser) {
                showMessage('يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            const newPost = {
                id: generateId(),
                userId: state.currentUser.id,
                authorName: state.currentUser.fullName,
                authorEmail: state.currentUser.email,
                content: content.trim(),
                category: category,
                createdAt: new Date().toISOString(),
                likes: 0,
                likedBy: []
            };

            let allPosts = storage.getPosts();
            allPosts.push(newPost);
            storage.savePosts(allPosts);

            showMessage('تم نشر المنشور بنجاح!', 'success');
            document.getElementById('postContent').value = '';
            loadPosts();
        }

        function toggleLike(postId) {
            if (!state.currentUser) {
                showMessage('يرجى تسجيل الدخول أولاً', 'error');
                return;
            }

            let allPosts = storage.getPosts();
            const post = allPosts.find(p => p.id === postId);
            
            if (!post) return;

            if (!post.likedBy) post.likedBy = [];

            const likeIndex = post.likedBy.indexOf(state.currentUser.id);
            if (likeIndex > -1) {
                post.likedBy.splice(likeIndex, 1);
                post.likes = Math.max(0, post.likes - 1);
            } else {
                post.likedBy.push(state.currentUser.id);
                post.likes = (post.likes || 0) + 1;
            }

            storage.savePosts(allPosts);
            loadPosts();
        }

        function filterByCategory(categoryName) {
            state.currentCategory = categoryName;
            loadPosts();
        }

        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar-responsive');
            const overlay = document.querySelector('.overlay-mobile');
            if (sidebar) {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }

        function closeMobileMenu() {
            const sidebar = document.querySelector('.sidebar-responsive');
            const overlay = document.querySelector('.overlay-mobile');
            if (sidebar) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
        }

        // ============ RENDER FUNCTIONS ============
        function renderAuthPage() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-blue-50 p-4">
                    <div class="w-full max-w-md">
                        <!-- Logo Section -->
                        <div class="text-center mb-8">
                            <div class="flex justify-center mb-4">
                                <div class="w-16 h-16 gradient-primary rounded-full flex items-center justify-center text-white text-3xl">
                                    <i class="mdi mdi-finance"></i>
                                </div>
                            </div>
                            <h1 class="text-4xl font-bold text-gray-800 mb-2">منصة المحاسبين</h1>
                            <p class="text-gray-600 text-sm md:text-base">شبكة تواصل احترافية للمحاسبين والخبراء الماليين</p>
                        </div>

                        <!-- Auth Card -->
                        <div class="bg-white rounded-2xl shadow-lg-custom p-6 md:p-8">
                            <!-- Login Form -->
                            <div id="loginForm">
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">تسجيل الدخول</h2>
                                <div class="space-y-4 mb-6">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">البريد الإلكتروني</label>
                                        <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" 
                                            class="input-field">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                                        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" 
                                            class="input-field">
                                    </div>
                                </div>
                                <button onclick="handleLoginClick()" 
                                    class="w-full btn-primary mb-4">
                                    دخول
                                </button>
                                <p class="text-center text-gray-600 text-sm">
                                    ليس لديك حساب؟ 
                                    <a href="#" onclick="toggleAuthForms(); return false;" class="text-purple-600 font-bold hover:text-purple-700">
                                        إنشاء حساب جديد
                                    </a>
                                </p>
                            </div>

                            <!-- Register Form -->
                            <div id="registerForm" class="hidden">
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">إنشاء حساب جديد</h2>
                                <div class="space-y-4 mb-6">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">الاسم الكامل</label>
                                        <input type="text" id="registerFullName" placeholder="أدخل اسمك الكامل" 
                                            class="input-field">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">البريد الإلكتروني</label>
                                        <input type="email" id="registerEmail" placeholder="أدخل بريدك الإلكتروني" 
                                            class="input-field">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                                        <input type="password" id="registerPassword" placeholder="اختر كلمة مرور قوية (6 أحرف على الأقل)" 
                                            class="input-field">
                                    </div>
                                </div>
                                <button onclick="handleRegisterClick()" 
                                    class="w-full btn-primary mb-4">
                                    إنشاء الحساب
                                </button>
                                <p class="text-center text-gray-600 text-sm">
                                    لديك حساب بالفعل؟ 
                                    <a href="#" onclick="toggleAuthForms(); return false;" class="text-purple-600 font-bold hover:text-purple-700">
                                        تسجيل الدخول
                                    </a>
                                </p>
                            </div>
                        </div>

                        <!-- Footer -->
                        <p class="text-center text-gray-500 text-xs md:text-sm mt-8">
                            &copy; 2026 منصة المحاسبين. جميع الحقوق محفوظة.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div class="flex h-screen bg-gray-50 overflow-hidden">
                    <!-- Mobile Menu Button -->
                    <button onclick="toggleMobileMenu()" class="md:hidden fixed top-4 left-4 z-50 p-2 bg-white rounded-lg shadow-lg hover:bg-gray-100">
                        <i class="mdi mdi-menu text-2xl text-gray-800"></i>
                    </button>

                    <!-- Mobile Overlay -->
                    <div class="overlay-mobile md:hidden" onclick="closeMobileMenu()"></div>

                    <!-- Sidebar -->
                    <aside class="sidebar-responsive md:relative md:w-64 bg-white shadow-lg flex flex-col overflow-y-auto">
                        <div class="p-6 border-b border-gray-200">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-12 h-12 gradient-primary rounded-full flex items-center justify-center text-white text-xl flex-shrink-0">
                                    <i class="mdi mdi-finance"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-gray-800">محاسبون</h1>
                            </div>
                        </div>

                        <!-- User Profile -->
                        <div class="p-6 border-b border-gray-200">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center flex-shrink-0">
                                    <i class="mdi mdi-account text-purple-600 text-xl"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-gray-800 truncate text-sm md:text-base">${state.currentUser.fullName}</p>
                                    <p class="text-xs text-gray-500 truncate">${state.currentUser.email}</p>
                                </div>
                            </div>
                            <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-semibold py-2 rounded-lg hover:bg-red-100 transition-all text-sm">
                                تسجيل الخروج
                            </button>
                        </div>

                        <!-- Categories -->
                        <div class="p-6 flex-1 overflow-y-auto scrollbar-hide">
                            <h3 class="text-xs font-bold text-gray-500 mb-4 uppercase">الأقسام</h3>
                            <ul class="space-y-2">
                                <li>
                                    <button onclick="filterByCategory(''); closeMobileMenu();" class="category-btn ${!state.currentCategory ? 'active' : ''}">
                                        <i class="mdi mdi-star text-xl"></i>
                                        <span>الكل</span>
                                    </button>
                                </li>
                                ${state.categories.map(cat => `
                                    <li>
                                        <button onclick="filterByCategory('${cat.name}'); closeMobileMenu();" class="category-btn ${state.currentCategory === cat.name ? 'active' : ''}">
                                            <i class="mdi ${cat.icon} text-xl"></i>
                                            <span>${cat.name}</span>
                                        </button>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Footer -->
                        <div class="p-6 border-t border-gray-200 text-center text-xs text-gray-500">
                            &copy; 2026 منصة المحاسبين
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <main class="flex-1 overflow-y-auto">
                        <div class="max-w-2xl mx-auto p-4 md:p-6 space-y-6">
                            <!-- Create Post -->
                            <div class="post-card">
                                <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">إنشاء منشور جديد</h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">الفئة</label>
                                        <select id="postCategory" class="input-field">
                                            ${state.categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-2">المحتوى</label>
                                        <textarea id="postContent" placeholder="ما الذي تود مشاركته مع المحاسبين؟" 
                                            class="input-field resize-none" 
                                            rows="4"></textarea>
                                    </div>
                                    <button onclick="handleCreatePostClick()" 
                                        class="w-full btn-primary">
                                        نشر المنشور
                                    </button>
                                </div>
                            </div>

                            <!-- Posts Feed -->
                            <div class="space-y-4">
                                ${state.posts.length === 0 ? `
                                    <div class="post-card text-center py-12">
                                        <i class="mdi mdi-inbox text-6xl text-gray-300 mb-4"></i>
                                        <p class="text-gray-500 text-base md:text-lg">لا توجد منشورات حتى الآن. كن أول من ينشر!</p>
                                    </div>
                                ` : state.posts.map(post => {
                                    const isLiked = post.likedBy && post.likedBy.includes(state.currentUser.id);
                                    return `
                                    <div class="post-card">
                                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                                <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center flex-shrink-0">
                                                    <i class="mdi mdi-account text-purple-600"></i>
                                                </div>
                                                <div class="flex-1 min-w-0">
                                                    <p class="font-bold text-gray-800 truncate text-sm md:text-base">${post.authorName}</p>
                                                    <p class="text-xs text-gray-500 truncate">${formatDate(post.createdAt)}</p>
                                                </div>
                                            </div>
                                            <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-semibold flex-shrink-0">${post.category}</span>
                                        </div>
                                        <p class="text-gray-700 mb-4 leading-relaxed text-sm md:text-base">${post.content}</p>
                                        <div class="flex gap-4 pt-4 border-t border-gray-200">
                                            <button onclick="toggleLike('${post.id}')" class="flex items-center gap-2 transition-all ${isLiked ? 'text-red-500' : 'text-gray-600 hover:text-red-500'}">
                                                <i class="mdi ${isLiked ? 'mdi-heart' : 'mdi-heart-outline'} text-xl"></i>
                                                <span class="text-sm">${post.likes || 0}</span>
                                            </button>
                                            <button class="flex items-center gap-2 text-gray-600 hover:text-blue-500 transition-all">
                                                <i class="mdi mdi-comment-outline text-xl"></i>
                                                <span class="text-sm">تعليق</span>
                                            </button>
                                            <button class="flex items-center gap-2 text-gray-600 hover:text-green-500 transition-all">
                                                <i class="mdi mdi-share-outline text-xl"></i>
                                                <span class="text-sm">مشاركة</span>
                                            </button>
                                        </div>
                                    </div>
                                `;
                                }).join('')}
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function render() {
            const root = document.getElementById('root');
            root.innerHTML = state.currentPage === 'auth' ? renderAuthPage() : renderDashboard();
        }

        // ============ EVENT HANDLERS ============
        function toggleAuthForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }

        function handleLoginClick() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            handleLogin(email, password);
        }

        function handleRegisterClick() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const fullName = document.getElementById('registerFullName').value;
            handleRegister(email, password, fullName);
        }

        function handleCreatePostClick() {
            const content = document.getElementById('postContent').value;
            const category = document.getElementById('postCategory').value;
            createPost(content, category);
        }

        // ============ INITIALIZATION ============
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        // Handle Enter key in forms
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && state.currentPage === 'auth') {
                if (document.getElementById('loginForm').classList.contains('hidden')) {
                    handleRegisterClick();
                } else {
                    handleLoginClick();
                }
            }
        });

        // Handle window resize for responsive behavior
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                closeMobileMenu();
            }
        });
    </script>
</body>
</html>
